<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - LifeSync</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="login-container">

    <div class="login-box">

        <h1>Create Account</h1>

        <p>Join LifeSync today.</p>

        <form action="/register" method="POST">

            <input
                type="text"
                name="name"
                placeholder="Enter Name"
                required>

            <input
                type="email"
                name="email"
                placeholder="Enter Email"
                required>

            <input
                type="password"
                name="password"
                placeholder="Enter Password"
                required>

            <button type="submit">
                Register
            </button>

        </form>

    </div>

</div>

</body>
</html>
