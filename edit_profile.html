<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile - LifeSync</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="login-container">

    <div class="login-box">

        <h1>✏ Edit Profile</h1>

        <p>Update your account information</p>

        <form method="POST">

            <input
                type="text"
                name="name"
                value="{{ user[0] }}"
                required
            >

            <input
                type="email"
                name="email"
                value="{{ user[1] }}"
                required
            >

            <button type="submit">
                💾 Save Changes
            </button>

        </form>

        <br>

        <a href="/profile">
            <button class="btn-secondary">
                ⬅ Cancel
            </button>
        </a>

    </div>

</div>

</body>

</html>
